name: Update Real Estate Dashboard

on:
  schedule:
    # 한국부동산원 주간 아파트 가격동향은 매주 목요일 14시(KST)에 나오고, 월간 통계와 한국은행 자료는 달 중순에 나온다.
    # 하루 두 번만 둔다. GitHub 예약 실행은 몇 시간씩 늦게 시작하므로(work-dashboard 실측 3~8시간) 늦어도 그날 안에
    # 목요일 발표가 반영되도록 오후 슬롯을 이른 시각에 둔다. 정시·30분은 GitHub 큐가 가장 붐비는 때라 피했다.
    # 2026-11-19 에는 예약이 9시간 늦게(23:28) 시작했다. 목요일 발표를 일찍 잡도록 목요일 오후~금요일 아침에 네 번 더 둔다.
    # 2026-11-28 부터 메일은 주 1회가 아니라 매일 08:00 에 나간다(사용자 요청). 예약이 4~10시간 늦게 시작하므로
    # 전날 저녁·밤 예약을 더해 KST 03:00~07:30 에 시작한 실행이 07:30 까지 기다렸다 08:00 에 보낸다(아래 설명).
    # 메일은 하루에 한 번만 나간다(.last-digest). 한 번 실행은 2분 안팎이다.
    - cron: '23 7 * * *'     # KST 16:23
    - cron: '41 9 * * *'     # KST 18:41
    - cron: '23 11 * * *'    # KST 20:23
    - cron: '17 13 * * *'    # KST 22:17
    - cron: '23 15 * * *'    # KST 00:23
    - cron: '13 17 * * *'    # KST 02:13
    - cron: '17 5 * * *'    # KST 14:17
    - cron: '43 21 * * *'   # KST 06:43
    - cron: '37 7,10,13 * * 4'   # KST 목 16:37, 19:37, 22:37
    - cron: '7 0 * * 5'     # KST 금 09:07
  workflow_dispatch:
    inputs:
      send_email:
        description: "메일 보내기(끄면 시험 실행: 메일 없이 화면만)"
        type: boolean
        default: true
      force_email:
        description: "지금 한 통 보내기(시험 발송: 오늘 보냄 표시를 남기지 않아 정기 메일은 그대로 나감)"
        type: boolean
        default: false
      mail_preview:
        description: "메일을 보내지 않고 본문·그림만 만들어 실행 결과(artifact)로 올리기"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 08시 메일을 위해 새벽에 시작한 실행은 07:30·08:00 까지 기다리므로 실행 전체는 길게 둔다(최대 6시간).
    # 서버가 답을 주지 않아 수집이 길어지는 것은 수집 단계의 timeout-minutes(20분)에서 끊는다.
    timeout-minutes: 360
    env:
      # 메일 비밀값이 저장소에 있는지(값은 보지 않는다). 없으면 메일 단계를 조용히 건너뛴다.
      HAS_MAIL: ${{ secrets.GMAIL_USERNAME != '' && secrets.GMAIL_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      # 08시 메일(2026-11-28, 사용자 요청: "3개 대시보드는 매일 내가 설정한 이메일로 08시에 도착하게").
      # GitHub 예약 실행은 4~10시간 늦게 시작한다(11/18~28 실측: 06:14 예약 → 11~14시, 13:43 예약 → 다음날 0시대).
      # 그래서 전날 저녁·밤에도 예약을 걸어 두고, KST 03:00~07:30 사이에 시작한 실행은 07:30 까지 기다렸다가 자료를 받는다
      # (03:00 보다 일찍부터 기다리면 수집·08:00 대기까지 합쳐 실행 제한 6시간에 걸린다).
      # 메일은 07:30 이후에만 만들고, 08:00 전이면 08:00:00 까지 기다렸다 보낸다(아래 'Wait until 08:00 KST').
      # 07:30 전에 시작한 실행은 메일을 보내지 않는다(자정 발송 방지). 오늘 이미 보냈으면 기다리지 않는다.
      - name: Hold early runs for the 08:00 mail
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s); d=$(TZ=Asia/Seoul date +%F)
          t0=$(TZ=Asia/Seoul date -d "$d 03:00" +%s); t1=$(TZ=Asia/Seoul date -d "$d 07:30" +%s)
          last=$(cat .last-digest 2>/dev/null | tr -d '[:space:]')
          if [[ "$last" != "$d" && $now -ge $t0 && $now -lt $t1 ]]; then
            echo "KST $(TZ=Asia/Seoul date +%H:%M) 시작: 07:30 까지 $(( (t1 - now) / 60 ))분 기다린 뒤 자료를 받습니다"
            sleep $(( t1 - now ))
          else
            echo "기다리지 않음(KST $(TZ=Asia/Seoul date +%H:%M), 마지막 발송 ${last:-없음})"
          fi


      # DASHBOARD-RULES.md 는 stockdashboard, work-dashboard 와 똑같이 쓰는 공통 규칙이다. 한쪽만 고치면 어긋나므로
      # 실행 때마다 stockdashboard 의 같은 파일과 비교해 다르면 경고만 남긴다(배포는 막지 않는다).
      - name: Compare shared rules with stockdashboard
        continue-on-error: true
        run: |
          # 세 대시보드 공통 규칙(DASHBOARD-RULES.md)도 같은 파일이어야 한다(2026-11-17).
          if curl -fsSL "https://raw.githubusercontent.com/JHKim0603/stockdashboard/master/DASHBOARD-RULES.md" -o /tmp/sibling-rules.md; then
            if cmp -s DASHBOARD-RULES.md /tmp/sibling-rules.md; then echo "DASHBOARD-RULES.md matches stockdashboard"
            else echo "::warning::DASHBOARD-RULES.md differs from stockdashboard - 세 저장소의 공통 규칙 파일을 같게 맞추세요"; fi
          fi

      # R-ONE 서버(www.reb.or.kr)는 중간 인증서를 보내지 않아 그대로는 인증서 검증이 실패한다. 발급처(WISeKey)가 공개한
      # 중간 인증서를 러너의 신뢰 목록에 더해 체인을 완성한다. 검증을 끄지 않는다. 인증서는 2029-02-24 까지 유효하다.
      - name: Add the R-ONE intermediate certificate
        run: |
          sudo cp certs/turingsign-rsa-secure-ca3.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          curl -fsS -o /dev/null "https://www.reb.or.kr/r-one/openapi/SttsApiTbl.do?Type=json&pSize=1" && echo "R-ONE TLS ok"

      - name: Generate dashboard.html
        shell: pwsh
        timeout-minutes: 20
        run: ./Update-RealEstateDashboard.ps1

      # 메일은 하루(KST)에 한 번, 08:00 에(2026-11-28 주간 → 매일). .last-digest 에 실제로 보낸 날을 적어 두고(커밋) 같은 날에는
      # 다시 보내지 않는다. 07:30 전 실행은 보내지 않는다. 보내기에 실패하면 표시를 남기지 않아 다음 실행이 다시 보낸다.
      # 시험 브랜치에서는 보내지 않는다. 집값 통계는 목요일에 새로 나오므로 금요일 메일부터 새 조사가 들어간다.
      - name: Decide whether today's mail goes out
        id: mailgate
        run: |
          today=$(TZ=Asia/Seoul date +%F); hm=$(TZ=Asia/Seoul date +%H%M)
          last=$(cat .last-digest 2>/dev/null | tr -d '[:space:]')
          echo "today=$today" >> "$GITHUB_OUTPUT"
          send=false; why=""
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then why="시험 브랜치(${GITHUB_REF_NAME})"
          elif [[ "${{ inputs.send_email }}" == "false" ]]; then why="send_email=false(시험 실행)"
          elif [[ "$HAS_MAIL" != "true" ]]; then why="저장소에 GMAIL_USERNAME·GMAIL_APP_PASSWORD 비밀값이 없음"
          elif [[ "${{ inputs.force_email }}" == "true" ]]; then send=true; why="force_email"
          elif [[ "$last" == "$today" ]]; then why="오늘($today) 메일은 이미 보냄"
          elif (( 10#$hm < 730 )); then why="KST $hm: 07:30 전 실행은 보내지 않음(아침 메일은 08:00)"
          else send=true; why="오늘 아침 메일"; fi
          echo "send=$send" >> "$GITHUB_OUTPUT"
          build=$send
          if [[ "${{ inputs.mail_preview }}" == "true" ]]; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "메일: send=$send build=$build - $why"

      # 메일 본문·그림: 화면과 같은 자료(dashboard.html 안의 JSON)로 그리고 크롬으로 PNG 를 찍는다(tools/weekly-mail.py).
      # 우분투 실행 환경에는 한글 글꼴이 없어 나눔고딕을 설치한다. 그림이 실패해도 메일은 글로 나간다.
      - name: Draw mail
        id: draw
        if: steps.mailgate.outputs.build == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq fonts-nanum > /dev/null && fc-cache -f > /dev/null || true
          python3 tools/weekly-mail.py
          echo "subject=$(cat email-subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload mail preview
        if: inputs.mail_preview == true && steps.draw.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: weekly-mail-preview
          path: |
            email-summary.html
            email-subject.txt
            mail-charts/

      # 08:00 전에 메일이 준비되면 08:00:00 까지 기다렸다 보낸다. 지금 한 통 보내기(force_email)는 기다리지 않는다.
      - name: Wait until 08:00 KST
        if: steps.mailgate.outputs.send == 'true' && inputs.force_email != true
        run: |
          now=$(date +%s); t=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 08:00" +%s)
          if (( now < t )); then echo "08:00 까지 $(( t - now ))초 기다립니다"; sleep $(( t - now )); else echo "08:00 이 지나 바로 보냅니다"; fi

      # 메일이 실패해도(비밀값 만료, SMTP 장애) 화면 배포는 계속한다.
      - name: Send daily mail
        id: mail
        if: steps.mailgate.outputs.send == 'true' && steps.draw.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.draw.outputs.subject }}
          to: jhyupkim@unid.co.kr
          from: 부동산 시장 Dashboard <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://email-summary.html
          # 첨부 그림은 파일 이름이 cid 가 되어 본문의 <img src="cid:파일이름"> 자리에 보인다.
          attachments: mail-charts/*.png

      - name: Mark today as mailed
        if: steps.mail.outcome == 'success' && inputs.force_email != true
        run: echo "${{ steps.mailgate.outputs.today }}" > .last-digest

      - name: Commit history and mail marker
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain data-history.json news-history.json .last-digest)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data-history.json
            [[ -f news-history.json ]] && git add news-history.json
            [[ -f .last-digest ]] && git add .last-digest
            git commit -m "chore: accumulate history $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "nothing to commit"
          fi

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
